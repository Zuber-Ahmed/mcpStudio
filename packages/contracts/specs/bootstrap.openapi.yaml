  "components": {
    "securitySchemes": {
      "localSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "mcpstudio_session",
        "description": "HttpOnly local session; exact Origin and CSRF required for cookie-auth mutations. Host bootstrap contract is a readiness hold."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id"
        ]
      },
      "BootstrapExchange": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "one_time_code": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "browser_nonce": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        },
        "required": [
          "one_time_code",
          "browser_nonce"
        ]
      },
      "LocalSession": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "actor_id": {
            "type": "string",
            "format": "uuid"
          },
          "tenant_id": {
            "type": "string",
            "format": "uuid"
          },
          "csrf_token": {
            "type": "string",
            "minLength": 43,
            "maxLength": 128
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "idle_timeout_seconds": {
            "type": "integer",
            "enum": [
              1800
            ]
          },
          "absolute_timeout_seconds": {
            "type": "integer",
            "enum": [
              28800
            ]
          }
        },
        "required": [
          "actor_id",
          "tenant_id",
          "csrf_token",
          "expires_at",
          "idle_timeout_seconds",
          "absolute_timeout_seconds"
        ]
      }
    }
  }
